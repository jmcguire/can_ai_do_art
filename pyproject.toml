[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "roomtone"
version = "0.1.0"
description = "Alternate OpenAI image generation and image description repeatedly."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "Pillow>=10.0",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
analysis = [
  "dreamsim>=0.2.1,<1",
  "numpy>=1.26,<3",
  "scikit-image>=0.22,<1",
]

[project.urls]
Homepage = "https://jmcguire.github.io/can_ai_do_art/"
Repository = "https://github.com/jmcguire/can_ai_do_art"

[project.scripts]
roomtone = "roomtone.cli:main"
roomtone-drift = "roomtone.drift_cli:main"
roomtone-gallery = "roomtone.gallery_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roomtone"]
