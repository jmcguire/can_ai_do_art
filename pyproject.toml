[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "roomtone"
version = "0.1.0"
description = "Alternate OpenAI image generation and image description repeatedly."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.urls]
Homepage = "https://jmcguire.github.io/can_ai_do_art/"
Repository = "https://github.com/jmcguire/can_ai_do_art"

[project.scripts]
roomtone = "roomtone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roomtone"]
